# Ordered policy rules. First match wins. See docs/architecture/LLD.md §3.7.
# This is the starting set from the design doc — expect it to move once
# real detectors and calibration data exist (tuning split only).

rules:
  - id: POL-001
    when: "finalBand == 'CRITICAL'"
    action: BLOCK

  - id: POL-002
    when: "finalBand == 'HIGH' and sourceTrust == 'untrusted'"
    action: BLOCK

  - id: POL-003
    when: "finalBand == 'HIGH' and sourceTrust == 'semi_trusted'"
    action: REVIEW

  # NOTE: in the code (packages/firewall-core/src/policy/decide-policy.ts) POL-004 is evaluated FIRST, ahead of
  # POL-001..003, so an LLM outage on a case whose rule band is already MEDIUM+ yields REVIEW even for HIGH/untrusted.
  - id: POL-004
    when: "llmStatus in ['unavailable', 'invalid_output', 'not_called'] and ruleBand >= 'MEDIUM'"
    action: REVIEW # or BLOCK, per LLM_FAILURE_MODE — see packages/agents/src/escalation/fail-safe.ts

  - id: POL-005
    when: "finalBand == 'MEDIUM'"
    action: SANITIZE

  - id: POL-006
    when: "otherwise"
    action: ALLOW
